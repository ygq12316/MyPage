name: Deploy Vue Site To GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "blog-vue/blog-github-pages/dist/**"
      - ".github/workflows/main.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-dist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check dist exists
        run: |
          if [ ! -d "blog-vue/blog-github-pages/dist" ]; then
            echo "Missing blog-vue/blog-github-pages/dist"
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: blog-vue/blog-github-pages/dist

  publish:
    needs: deploy-dist
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
